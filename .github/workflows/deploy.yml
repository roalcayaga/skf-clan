name: Deploy SkF to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: skf-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and typecheck
        run: npm run build

      - name: Diagnose legacy dojo page
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'diag/recover-legacy-dojo-page' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "=== CURRENT DOJO PAGE ==="
          npx wrangler d1 execute skf-mustr --remote -c wrangler.jsonc --json --command "SELECT slug,title,show_in_nav,is_public,updated_at,updated_by,layout FROM page_layouts WHERE slug='dojo';"
          echo "=== DOJO PAGE AUDIT ==="
          npx wrangler d1 execute skf-mustr --remote -c wrangler.jsonc --json --command "SELECT action,target_type,target_id,actor_id,created_at,meta FROM audit_log WHERE target_type='page' AND target_id='dojo' ORDER BY created_at DESC LIMIT 30;"
          echo "=== ACTOR 2 ==="
          npx wrangler d1 execute skf-mustr --remote -c wrangler.jsonc --json --command "SELECT id,username,global_name,display_name,status FROM users WHERE id=2;"
          echo "=== HISTORICAL BOOKMARKS ==="
          npx wrangler d1 time-travel info skf-mustr -c wrangler.jsonc --timestamp="2026-11-01T15:50:00Z" --json
          npx wrangler d1 time-travel info skf-mustr -c wrangler.jsonc --timestamp="2026-11-02T15:10:00Z" --json
          npx wrangler d1 time-travel info skf-mustr -c wrangler.jsonc --timestamp="2026-11-02T15:20:00Z" --json
          echo "=== CURRENT TIME TRAVEL INFO ==="
          npx wrangler d1 time-travel info skf-mustr -c wrangler.jsonc --json


      - name: Run tests
        run: npm test

      - name: Verify legacy D1 baseline
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler d1 execute skf-mustr --remote -c wrangler.jsonc --command "SELECT availability FROM event_signups LIMIT 1;"

      - name: Bootstrap legacy D1 migration ledger
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler d1 execute skf-mustr --remote -c wrangler.jsonc --file scripts/d1-baseline-through-0037.sql

      - name: Apply D1 migrations
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler d1 migrations apply skf-mustr --remote -c wrangler.jsonc

      - name: Deploy to Cloudflare
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler deploy -c wrangler.jsonc

      - name: Cloudflare credentials not configured
        if: ${{ github.event_name == 'push' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '') }}
        run: |
          echo "Build/tests passed."
          echo "Deploy skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured in GitHub Actions secrets."
