name: Deploy SkF to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: skf-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and typecheck
        run: npm run build

      - name: Temporarily disable external chat link
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'ops/disable-chat-link' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "=== BEFORE ==="
          npx wrangler d1 execute skf-mustr --remote -c wrangler.jsonc --json --command "SELECT slug,title,layout,updated_at,updated_by FROM page_layouts WHERE slug='chat';"
          echo "=== UPDATE ==="
          npx wrangler d1 execute skf-mustr --remote -c wrangler.jsonc --json --command "UPDATE page_layouts SET layout=json_set(layout, '$.rows[0].columns[0].modules[0].config.html', '<p>🥋 EL DOJO DEL DRAGÓN</p><p>El punto de encuentro del clan. Salas de chat para coordinar entrenamientos, amistoso,</p><p>comentar torneos y hablar de lo que sea — solo miembros.</p><p><strong>Chat temporalmente deshabilitado mientras revisamos la alerta de seguridad de Google.</strong></p>'), updated_at=unixepoch() WHERE slug='chat';"
          echo "=== AFTER ==="
          npx wrangler d1 execute skf-mustr --remote -c wrangler.jsonc --json --command "SELECT slug,title,layout,updated_at,updated_by FROM page_layouts WHERE slug='chat';"


      - name: Run tests
        run: npm test

      - name: Verify legacy D1 baseline
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler d1 execute skf-mustr --remote -c wrangler.jsonc --command "SELECT availability FROM event_signups LIMIT 1;"

      - name: Bootstrap legacy D1 migration ledger
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler d1 execute skf-mustr --remote -c wrangler.jsonc --file scripts/d1-baseline-through-0037.sql

      - name: Apply D1 migrations
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler d1 migrations apply skf-mustr --remote -c wrangler.jsonc

      - name: Deploy to Cloudflare
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler deploy -c wrangler.jsonc

      - name: Cloudflare credentials not configured
        if: ${{ github.event_name == 'push' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '') }}
        run: |
          echo "Build/tests passed."
          echo "Deploy skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured in GitHub Actions secrets."
